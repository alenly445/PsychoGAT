<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PsychoGAT — 沉浸式心灵探索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== CSS Variables ===== */
:root {
  --bg-body: #080816;
  --bg-card: rgba(18, 18, 40, 0.85);
  --bg-card-hover: rgba(28, 28, 56, 0.9);
  --text-primary: #ede8e0;
  --text-secondary: #9b94a8;
  --text-muted: #6b6478;
  --accent-gold: #d4a84b;
  --accent-gold-dim: rgba(212, 168, 75, 0.15);
  --accent-teal: #5ac8b0;
  --accent-rose: #d46b82;
  --border-glow: rgba(212, 168, 75, 0.2);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --radius: 12px;
  --radius-lg: 20px;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-story: 'Noto Serif SC', Georgia, serif;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-ui);
  background: var(--bg-body);
  color: var(--text-primary);
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(60, 30, 90, 0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(30, 60, 90, 0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(90, 50, 30, 0.08) 0%, transparent 50%),
    var(--bg-body);
}

/* ===== Particles Canvas ===== */
#particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ===== Container ===== */
#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 800px;
  height: 100vh;
  max-height: 700px;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

/* ===== Screen System ===== */
.screen {
  display: none;
  flex-direction: column;
  height: 100%;
  animation: fadeIn 0.5s ease;
}
.screen.active { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== Start Screen ===== */
#screen-start {
  align-items: center;
  justify-content: center;
  text-align: center;
}

.start-title {
  font-family: var(--font-story);
  font-size: 2.5rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-gold), #f0d68a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.start-subtitle {
  color: var(--text-secondary);
  font-size: 1rem;
  font-weight: 300;
  margin-bottom: 48px;
  letter-spacing: 4px;
}

.start-form {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-group {
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-bottom: 6px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.form-group select,
.form-group input {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 0.95rem;
  outline: none;
  transition: border-color var(--transition);
}

.form-group select:focus,
.form-group input:focus {
  border-color: var(--accent-gold);
}

.form-group select option {
  background: var(--bg-body);
  color: var(--text-primary);
}

.btn-primary {
  padding: 14px 32px;
  background: linear-gradient(135deg, var(--accent-gold), #c49630);
  color: #0a0a1a;
  border: none;
  border-radius: var(--radius);
  font-family: var(--font-ui);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  letter-spacing: 2px;
  margin-top: 8px;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(212, 168, 75, 0.3);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.start-footer {
  position: absolute;
  bottom: 24px;
  color: var(--text-muted);
  font-size: 0.72rem;
  letter-spacing: 1px;
}

.start-footer a {
  color: var(--accent-gold);
  text-decoration: none;
}

/* ===== Loading Screen ===== */
#screen-loading {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 32px;
}

.loading-ring {
  width: 80px;
  height: 80px;
  border: 3px solid var(--border-glow);
  border-top-color: var(--accent-gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-family: var(--font-story);
  font-size: 1.1rem;
  color: var(--text-secondary);
  min-height: 2em;
}

.loading-dots::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

.loading-progress {
  width: 240px;
  height: 3px;
  background: var(--border-glow);
  border-radius: 2px;
  overflow: hidden;
}

.loading-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-gold), #f0d68a);
  border-radius: 2px;
  width: 0%;
  transition: width 0.8s ease;
}

/* ===== Game Screen ===== */
#screen-game {
  gap: 0;
}

.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  flex-shrink: 0;
}

.game-title-bar {
  font-family: var(--font-story);
  font-size: 0.9rem;
  color: var(--accent-gold);
}

.game-round-info {
  text-align: right;
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.game-round-num {
  font-weight: 600;
  color: var(--text-primary);
}

.game-progress-container {
  width: 100%;
  height: 4px;
  background: var(--border-glow);
  border-radius: 2px;
  margin-bottom: 24px;
  flex-shrink: 0;
  overflow: hidden;
}

.game-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-gold), #f0d68a);
  border-radius: 2px;
  transition: width 0.6s ease;
  width: 0%;
}

.game-dimension {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  flex-shrink: 0;
}

.game-dimension-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.game-dimension-name {
  font-size: 0.85rem;
  color: var(--accent-teal);
  font-weight: 500;
}

/* ===== Story Card ===== */
.story-card {
  flex: 1;
  min-height: 0;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  overflow-y: auto;
  position: relative;
  backdrop-filter: blur(12px);
  scrollbar-width: thin;
  scrollbar-color: var(--border-glow) transparent;
}

.story-card::-webkit-scrollbar {
  width: 4px;
}
.story-card::-webkit-scrollbar-thumb {
  background: var(--border-glow);
  border-radius: 2px;
}

.story-text {
  font-family: var(--font-story);
  font-size: 1.05rem;
  line-height: 1.9;
  color: var(--text-primary);
  white-space: pre-wrap;
  opacity: 0;
  animation: storyReveal 0.8s ease forwards;
}

@keyframes storyReveal {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.story-memory {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border-glow);
  font-size: 0.82rem;
  color: var(--text-muted);
  line-height: 1.6;
}

.story-memory summary {
  cursor: pointer;
  font-size: 0.75rem;
  color: var(--text-secondary);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ===== Choices ===== */
.choices-area {
  display: flex;
  gap: 12px;
  padding-top: 20px;
  flex-shrink: 0;
}

.choice-btn {
  flex: 1;
  padding: 16px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 0.9rem;
  line-height: 1.5;
  cursor: pointer;
  transition: all var(--transition);
  text-align: left;
  position: relative;
  overflow: hidden;
}

.choice-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent-gold-dim), transparent);
  opacity: 0;
  transition: opacity var(--transition);
}

.choice-btn:hover::before {
  opacity: 1;
}

.choice-btn:hover {
  border-color: var(--accent-gold);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.choice-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
}

.choice-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 4px;
  position: relative;
  z-index: 1;
}

.choice-text {
  position: relative;
  z-index: 1;
}

/* ===== Score Badge ===== */
.score-badge {
  text-align: center;
  padding-top: 12px;
  flex-shrink: 0;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.score-badge span {
  color: var(--accent-gold);
  font-weight: 600;
}

/* ===== Result Screen ===== */
#screen-result {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 20px;
}

.result-score-ring {
  position: relative;
  width: 140px;
  height: 140px;
  margin: 0 auto;
}

.result-score-ring svg {
  transform: rotate(-90deg);
}

.result-score-ring .bg {
  fill: none;
  stroke: var(--border-glow);
  stroke-width: 6;
}

.result-score-ring .fill {
  fill: none;
  stroke: var(--accent-gold);
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.5s ease;
}

.result-score-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.result-score-num .score {
  font-family: var(--font-story);
  font-size: 2.6rem;
  font-weight: 700;
  line-height: 1;
}

.result-score-num .total {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.result-details {
  width: 100%;
  max-width: 480px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  padding: 16px 20px;
}

.result-detail-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 0.85rem;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.result-detail-row:last-child {
  border-bottom: none;
}

.result-detail-row .name {
  color: var(--text-secondary);
}

.result-detail-row .score-tag {
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 500;
}

.score-tag-depressed {
  background: rgba(212, 107, 130, 0.15);
  color: var(--accent-rose);
}
.score-tag-healthy {
  background: rgba(90, 200, 176, 0.15);
  color: var(--accent-teal);
}

.result-summary {
  width: 100%;
  max-width: 480px;
  display: flex;
  justify-content: center;
  gap: 32px;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.result-summary-item {
  text-align: center;
}

.result-summary-item .num {
  font-family: var(--font-story);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--text-primary);
  display: block;
}

.result-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn-secondary {
  padding: 12px 28px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
}

.btn-secondary:hover {
  border-color: var(--accent-gold);
  background: var(--bg-card-hover);
}

/* ===== Error Screen ===== */
#screen-error {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 16px;
}

.error-icon {
  font-size: 3rem;
}

.error-title {
  font-family: var(--font-story);
  font-size: 1.2rem;
  color: var(--accent-rose);
}

.error-msg {
  color: var(--text-secondary);
  font-size: 0.85rem;
  max-width: 400px;
  line-height: 1.6;
}

/* ===== Age Selection Screen ===== */
#screen-age {
  align-items: center;
  justify-content: center;
  text-align: center;
}

.age-title {
  font-family: var(--font-story);
  font-size: 2.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-gold), #f0d68a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  letter-spacing: 2px;
}

.age-subtitle {
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 300;
  margin-bottom: 36px;
  letter-spacing: 3px;
}

.age-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 440px;
}

.age-card {
  padding: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  text-align: center;
  font-size: 1rem;
  font-weight: 500;
  color: var(--text-primary);
  font-family: var(--font-ui);
  letter-spacing: 1px;
}

.age-card:hover {
  border-color: var(--accent-gold);
  background: var(--accent-gold-dim);
  transform: translateX(4px);
  box-shadow: var(--shadow);
}

.age-card.selected {
  border-color: var(--accent-gold);
  background: var(--accent-gold-dim);
  box-shadow: 0 0 20px rgba(212, 168, 75, 0.15);
}

/* ===== Theme Selection ===== */
.theme-group {
  width: 100%;
  max-width: 440px;
}

.theme-back-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 0.85rem;
  transition: color var(--transition);
  background: none;
  border: none;
  font-family: var(--font-ui);
  padding: 4px 0;
}

.theme-back-row:hover {
  color: var(--accent-gold);
}

.theme-back-arrow {
  font-size: 1rem;
}

.theme-label {
  display: block;
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-bottom: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.theme-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}

.theme-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  text-align: center;
  min-height: 90px;
}

.theme-card:hover {
  border-color: var(--accent-gold);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.theme-card.selected {
  border-color: var(--accent-gold);
  background: var(--accent-gold-dim);
  box-shadow: 0 0 20px rgba(212, 168, 75, 0.15);
}

.theme-card-icon {
  font-size: 1.6rem;
  line-height: 1;
}

.theme-card-label {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-primary);
}

.theme-card-desc {
  font-size: 0.65rem;
  color: var(--text-muted);
  line-height: 1.3;
}


/* ===== Scrollbar for Webkit ===== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 2px; }

/* ===== Responsive ===== */
@media (max-width: 600px) {
  #app {
    padding: 12px;
    max-height: none;
    height: 100dvh;
  }
  .start-title { font-size: 1.8rem; }
  .start-subtitle { margin-bottom: 32px; font-size: 0.85rem; }
  .story-card { padding: 20px; }
  .story-text { font-size: 0.95rem; }
  .choices-area { flex-direction: column; gap: 8px; }
  .choice-btn { padding: 14px 16px; }
  .game-header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .game-round-info { text-align: left; }
  .result-details { padding: 12px 16px; }
  .result-summary { gap: 16px; flex-wrap: wrap; }

  /* Age screen responsive */
  .age-title { font-size: 1.6rem; }
  .age-grid { gap: 10px; }
  .age-card { padding: 14px 16px; }

  /* Theme screen responsive */
  .theme-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .theme-card { padding: 12px 8px; min-height: 76px; }
  .theme-card-icon { font-size: 1.3rem; }
  .theme-card-label { font-size: 0.75rem; }
  .theme-card-desc { display: none; }
}
</style>
</head>
<body>

<!-- ===== Particles ===== -->
<canvas id="particles"></canvas>

<!-- ===== App Container ===== -->
<div id="app">

  <!-- AGE SELECT SCREEN -->
  <div id="screen-age" class="screen active">
    <div class="age-title">PsychoGAT</div>
    <div class="age-subtitle">— 沉浸式心灵探索 —</div>

    <!-- 名字输入（必填，放在年龄上方） -->
    <div class="name-field" style="width:100%;max-width:440px;text-align:left;margin-bottom:24px">
      <label for="userName" style="display:block;font-size:0.78rem;color:var(--text-secondary);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase">
        你的名字 *
      </label>
      <input id="userName" type="text" placeholder="请输入你的名字" maxlength="20" required
        style="width:100%;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--radius);color:var(--text-primary);font-family:var(--font-ui);font-size:0.95rem;outline:none;transition:border-color 0.35s">
    </div>

    <div style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:10px;letter-spacing:1px;text-transform:uppercase">
      选择年龄段
    </div>
    <div class="age-grid" id="ageGrid">
      <div class="age-card" data-age="child" onclick="selectAge('child')">6–12 岁</div>
      <div class="age-card" data-age="teen" onclick="selectAge('teen')">13–17 岁</div>
      <div class="age-card" data-age="young" onclick="selectAge('young')">18–30 岁</div>
      <div class="age-card" data-age="middle" onclick="selectAge('middle')">31–50 岁</div>
      <div class="age-card" data-age="elder" onclick="selectAge('elder')">51 岁以上</div>
    </div>
    <div class="start-footer">
      探索内心的微光 · 基于 PsychoGAT 框架
    </div>
  </div>

  <!-- START SCREEN (theme selection) -->
  <div id="screen-start" class="screen">
    <div class="start-title">PsychoGAT</div>
    <div class="start-subtitle" id="startSubtitle">— 选择你的故事世界 —</div>
    <form class="start-form" id="startForm" onsubmit="return false;">
      <div class="theme-group">
        <div class="theme-back-row" onclick="showAgeSelect()">
          <span class="theme-back-arrow">←</span>
          <span>重新选择年龄段</span>
        </div>
        <div class="theme-label" id="themeLabel">选择故事主题</div>
        <div class="theme-grid" id="themeGrid"></div>
        <button class="btn-primary" id="btnStart" onclick="startGame()">开始旅程</button>
      </div>
    </form>
    <div class="start-footer">
      探索内心的微光 · 基于 PsychoGAT 框架
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div id="screen-loading" class="screen">
    <div class="loading-ring"></div>
    <div class="loading-text" id="loadingText">设计师正在编织故事世界<span class="loading-dots"></span></div>
    <div class="loading-progress">

  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">

      <div class="game-title-bar" id="gameTitle"></div>

    </div>

      <div class="story-text" id="storyText"></div>

      <button class="choice-btn" id="choice1" onclick="makeChoice(1)">

  <div id="screen-result" class="screen">

      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle class="bg" cx="70" cy="70" r="60"/>
        <circle class="fill" id="scoreCircle" cx="70" cy="70" r="60"
          stroke-dasharray="377" stroke-dashoffset="377"/>
      </svg>

        <span class="score" id="resultScore">0</span>
        <span class="total">/ 9</span>
      </div>
    </div>
    <div class="result-summary">
      <div class="result-summary-item">
        <span class="num" id="healthyCount">0</span>

      <div class="result-summary-item">
        <span class="num" id="depressedCount">0</span>
        有倾向方向

      <button class="btn-secondary" onclick="showStart()">重新开始</button>
    </div>

  <div id="screen-error" class="screen">
    <div class="error-icon">⚠️</div>
    <div class="error-title">出了点问题</div>
    <div class="error-msg" id="errorMsg">无法连接到服务器，请稍后重试。</div>
    <button class="btn-primary" onclick="showStart()">返回首页</button>
  </div>

</div>

<script>
// ===== Particles Effect =====
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animId;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = 50;
  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 0.5,
      dx: (Math.random() - 0.5) * 0.3,
      dy: (Math.random() - 0.5) * 0.3,
      o: Math.random() * 0.5 + 0.1,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.dx;
      p.y += p.dy;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212, 168, 75, ${p.o})`;
      ctx.fill();
    }
    animId = requestAnimationFrame(draw);
  }
  draw();
})();

// ===== App State =====
let gameId = null;
let loadingInterval = null;
let selectedAgeGroup = '';

// ===== Age Group Config =====

// ===== Screen Management =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== Age Selection =====
function selectAge(ageKey) {
  selectedAgeGroup = ageKey;
  const group = AGE_GROUPS[ageKey];
  if (!group) return;

  // Update subtitle
  document.getElementById('startSubtitle').textContent = '— ' + group.subtitle + ' —';
  document.getElementById('themeLabel').textContent = group.label + ' · 选择故事主题';

  // Build theme grid
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = group.themes.map(t => `
    <div class="theme-card" data-theme="${t.id}" onclick="selectTheme('${t.id}')">
      <div class="theme-card-icon">${t.icon}</div>
      <div class="theme-card-label">${t.id}</div>
      <div class="theme-card-desc">${t.desc}</div>
    </div>
  `).join('');

  // Reset hidden gameType
  if (!window._selectedTheme) {
    window._selectedTheme = group.themes[0].id;
    document.querySelectorAll('.theme-card')[0]?.classList.add('selected');
  }

  showScreen('screen-start');
}

function selectTheme(themeId) {
  window._selectedTheme = themeId;
  document.querySelectorAll('.theme-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.theme === themeId);
  });
}

function showAgeSelect() {
  window._selectedTheme = null;
  showScreen('screen-age');
}

// ===== Start (restart) =====
function showStart() {
  gameId = null;
  if (loadingInterval) { clearInterval(loadingInterval); loadingInterval = null; }
  document.getElementById('btnStart').disabled = false;
  showAgeSelect();
}

// ===== Start Game =====
async function startGame() {
  const btn = document.getElementById('btnStart');
  btn.disabled = true;

  const gameType = window._selectedTheme || '奇幻';
  const gameTopic = gameType;
  const ageGroup = selectedAgeGroup;
  const userName = document.getElementById('userName').value.trim();

  if (!userName) {
    showError('请先输入你的名字');
    btn.disabled = false;
    return;
  }

  if (!ageGroup) {
    showError('请先选择年龄段');
    btn.disabled = false;
    return;
  }

  showScreen('screen-loading');
  startLoadingAnimation();

  try {
    const res = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        game_type: gameType,
        game_topic: gameTopic,
        age_group: ageGroup,
        user_name: userName,
      }),
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      stopLoadingAnimation();
      showError(data.error || '服务器返回错误');
      btn.disabled = false;
      return;
    }

    gameId = data.game_id;
    stopLoadingAnimation();
    renderRound(data);

  } catch (err) {
    stopLoadingAnimation();
    showError('网络连接失败，请检查服务器是否运行');
    btn.disabled = false;
  }
}

// ===== Loading Animation =====
function startLoadingAnimation() {
  let idx = 0;
  const el = document.getElementById('loadingText');
  const bar = document.getElementById('loadingBar');
  let progress = 0;

  el.textContent = LOADING_MESSAGES[0] + '...';

  loadingInterval = setInterval(() => {
    idx = (idx + 1) % LOADING_MESSAGES.length;
    el.textContent = LOADING_MESSAGES[idx] + '...';
    progress = Math.min(progress + 8, 85);
    bar.style.width = progress + '%';
  }, 4000);
}

function stopLoadingAnimation() {
  if (loadingInterval) {
    clearInterval(loadingInterval);
    loadingInterval = null;
  }
  document.getElementById('loadingBar').style.width = '100%';
}

// ===== Render Round =====
function renderRound(data) {
  document.getElementById('gameTitle').textContent = data.game_title || 'PsychoGAT';
  document.getElementById('roundNum').textContent = data.round;
  document.getElementById('totalRounds').textContent = data.total_rounds || 9;
  document.getElementById('progressBar').style.width = (data.round / (data.total_rounds || 9) * 100) + '%';
  document.getElementById('dimensionName').textContent = data.dimension || '—';
  document.getElementById('storyText').textContent = data.paragraph || '';
  document.getElementById('choiceText1').textContent = data.instruction_1 || '';
  document.getElementById('choiceText2').textContent = data.instruction_2 || '';

  // 启用按钮
  document.getElementById('choice1').disabled = false;
  document.getElementById('choice2').disabled = false;
  document.getElementById('choice1').style.opacity = '1';
  document.getElementById('choice2').style.opacity = '1';

  // 更新得分
  if (data.scores_so_far !== undefined) {
    document.getElementById('scoreDisplay').textContent = data.scores_so_far;
  }

  // 滚动到顶部
  document.getElementById('storyCard').scrollTop = 0;

  showScreen('screen-game');
}

// ===== Make Choice =====
async function makeChoice(choice) {
  if (!gameId) return;

  // 禁用按钮，防止重复点击
  document.getElementById('choice1').disabled = true;
  document.getElementById('choice2').disabled = true;

  // 显示加载页：「下一段旅行生成中」
  document.getElementById('loadingText').textContent = '下一段旅行生成中';
  document.getElementById('loadingBar').style.width = '30%';
  if (loadingInterval) { clearInterval(loadingInterval); loadingInterval = null; }
  showScreen('screen-loading');

  // 简单进度动画
  let progress = 30;
  loadingInterval = setInterval(() => {
    progress = Math.min(progress + 5, 80);
    document.getElementById('loadingBar').style.width = progress + '%';
  }, 3000);

  try {
    const res = await fetch('/api/choice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ game_id: gameId, choice: choice }),
    });

    const data = await res.json();

    if (loadingInterval) { clearInterval(loadingInterval); loadingInterval = null; }
    document.getElementById('loadingBar').style.width = '100%';

    if (!res.ok || data.error) {
      showError(data.error || '处理选择时出错');
      return;
    }

    if (data.completed) {
      renderResults(data);
    } else {
      renderRound(data);
    }

  } catch (err) {
    if (loadingInterval) { clearInterval(loadingInterval); loadingInterval = null; }
    showError('网络连接失败，请检查服务器');
  }
}

// ===== Render Results =====
function renderResults(data) {
  const total = data.total_score;

  // Score circle animation
  const circle = document.getElementById('scoreCircle');
  const circumference = 377;
  const offset = circumference - (total / 9) * circumference;
  document.getElementById('resultScore').textContent = total;

  setTimeout(() => {
    circle.style.strokeDashoffset = offset;
  }, 300);

  // Count healthy vs depressed
  const dims = data.dimensions || [];
  const healthy = dims.filter(d => d.score === 0).length;
  const depressed = dims.filter(d => d.score === 1).length;
  document.getElementById('healthyCount').textContent = healthy;
  document.getElementById('depressedCount').textContent = depressed;

  // Detail rows
  const detailsEl = document.getElementById('resultDetails');
  detailsEl.innerHTML = dims.map(d => `
    <div class="result-detail-row">
      <span class="name">${d.round}. ${d.name}</span>
      <span class="score-tag ${d.score === 1 ? 'score-tag-depressed' : 'score-tag-healthy'}">
        ${d.score === 1 ? '⚠️ 有倾向' : '✅ 无倾向'} · ${d.score}分
      </span>
    </div>
  `).join('');

  showScreen('screen-result');
}

// ===== Error =====
function showError(msg) {
  document.getElementById('errorMsg').textContent = msg || '未知错误';
  showScreen('screen-error');
}
</script>
